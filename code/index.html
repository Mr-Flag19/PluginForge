<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PluginForge</title>
<meta name="description" content="Your PluginForge chats and generated plugins.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233A3D42'/%3E%3Cpath d='M11 11l5 5-5 5m7 0h4' fill='none' stroke='%23f4f4f5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    /* Single dark look, set explicitly so it reads the same on any host theme */
    :root {
        color-scheme: dark;
        scroll-behavior: smooth;
        --bg: #26282B;
        --fg: #f4f4f5;
    }
    body {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
    }
    html, body, #root {
        height: 100%;
    }
    body { margin: 0; }
    ::selection {
        background: #3A3D42;
        color: #f4f4f5;
    }
    .font-mono {
        font-family: 'JetBrains Mono', monospace;
    }
    /* Developer dot-grid background overlay */
    .bg-grid-pattern {
        background-image: radial-gradient(#3A3D42 1px, transparent 1px);
        background-size: 24px 24px;
    }
    ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    ::-webkit-scrollbar-track {
        background: #26282B;
    }
    ::-webkit-scrollbar-thumb {
        background: #3A3D42;
        border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #4b4f56;
    }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    /* ------------------------------------------------------------------ */
    /* Chat workspace (opens from every "Get Access" / "Get Started" link) */
    /* ------------------------------------------------------------------ */

    const ICONS = {
        plus: "M12 4.5v15m7.5-7.5h-15",
        search: "M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z",
        menu: "M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5",
        close: "M6 18L18 6M6 6l12 12",
        trash: "M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0",
        send: "M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3",
        logo: "M8 9l3 3-3 3m5 0h3",
        cube: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4",
        code: "M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4",
        lock: "M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z",
        back: "M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18",
        signout: "M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"
    };

    function Icon({ d, className = "w-4 h-4", sw = 2 }) {
        return (
            <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={sw}>
                <path strokeLinecap="round" strokeLinejoin="round" d={d} />
            </svg>
        );
    }

    function LogoMark({ className = "w-7 h-7" }) {
        return (
            <div className={`${className} bg-[#3A3D42] rounded-md flex items-center justify-center text-[#f4f4f5] shrink-0`}>
                <Icon d={ICONS.logo} className="w-4 h-4" />
            </div>
        );
    }

    const NOT_CONNECTED = "Plugin generation isn't connected yet, so I can't build this plugin right now. Your message is saved to this project, so it will be here when building goes live.";

    const SUGGESTIONS = [
        { title: "Prison mine", text: "Create a prison mine plugin with rank progression and automated resets." },
        { title: "Lifesteal system", text: "Build a custom lifesteal system with heart crafting recipes and revive beacons." },
        { title: "Land claims", text: "Create a claims plugin with trust levels, sub-claims, and clean chat notifications." },
        { title: "RPG classes", text: "Build an RPG class selector with mana regeneration, custom spells, and cooldowns." }
    ];

    const CHAT_GROUPS = ["Today", "Yesterday", "Previous 7 days", "Older"];

    function groupFor(ms) {
        const startOfToday = new Date();
        startOfToday.setHours(0, 0, 0, 0);
        const day = 24 * 60 * 60 * 1000;
        const today = startOfToday.getTime();
        if (ms >= today) return "Today";
        if (ms >= today - day) return "Yesterday";
        if (ms >= today - 7 * day) return "Previous 7 days";
        return "Older";
    }

    const ID_CHARS = 'abcdefghijklmnopqrstuvwxyz0123456789';
    const ID_FROM_PATH = /\/([a-z0-9]{16})\/?$/;

    // Placeholder ID shown for a moment until the server assigns the real one
    function newProjectId() {
        let id = '';
        while (id.length < 16) {
            const bytes = new Uint8Array(32);
            crypto.getRandomValues(bytes);
            for (const b of bytes) {
                if (b < 252 && id.length < 16) id += ID_CHARS[b % 36];
            }
        }
        return id;
    }

    function getIdFromPath() {
        const m = window.location.pathname.match(ID_FROM_PATH);
        return m ? m[1] : null;
    }

    // The folder this page lives in, e.g. /code/ (works for any folder name)
    function getBasePath() {
        const path = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/[a-z0-9]{16}\/?$/, '').replace(/\/+$/, '');
        return path + '/';
    }

    function navigateTo(id, replace) {
        try {
            const base = getBasePath();
            const url = id ? base + id : base;
            if (window.location.pathname === url) return;
            window.history[replace ? 'replaceState' : 'pushState']({}, '', url);
        } catch (e) {}
    }

    // ---- Talking to the server (/api/projects). Your Discord sign-in cookie is sent automatically. ----
    async function api(path, method, body) {
        try {
            const r = await fetch('/api/projects' + path, {
                method,
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', 'x-pf-request': '1' },
                body: body ? JSON.stringify(body) : undefined
            });
            let data = null;
            try { data = await r.json(); } catch (e) {}
            return { ok: r.ok, status: r.status, data };
        } catch (e) {
            return { ok: false, status: 0, data: null };
        }
    }

    const plainMessages = (msgs) => msgs.map((m) => ({ role: m.role, text: m.text || '' }));

    const initialsOf = (name) => (String(name || '?').trim().split(/\s+/).slice(0, 2).map((w) => w.charAt(0)).join('') || '?').toUpperCase();

    function DiscordMark() {
        return (
            <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" />
            </svg>
        );
    }

    // Discord profile picture, with initials if there is none or it fails to load
    function Avatar({ user }) {
        const [failed, setFailed] = React.useState(false);
        if (user.avatar && !failed) {
            return <img src={user.avatar} alt="" onError={() => setFailed(true)} className="w-9 h-9 rounded-md shrink-0 bg-[#3A3D42] border border-[#4b4f56] object-cover" />;
        }
        return (
            <div className="w-9 h-9 rounded-md bg-[#3A3D42] border border-[#4b4f56] flex items-center justify-center text-sm font-semibold text-[#f4f4f5] shrink-0" aria-hidden="true">{initialsOf(user.name)}</div>
        );
    }

    function LoadingScreen() {
        return (
            <div className="h-full flex items-center justify-center bg-[#26282B]" role="status" aria-label="Loading">
                <div className="animate-pulse"><LogoMark className="w-10 h-10" /></div>
            </div>
        );
    }

    function SignInScreen({ message, unavailable }) {
        const next = encodeURIComponent(window.location.pathname);
        return (
            <div className="min-h-full h-full relative flex flex-col bg-[#26282B] text-[#f4f4f5] font-sans overflow-y-auto">
                <div className="fixed inset-0 bg-grid-pattern opacity-30 pointer-events-none"></div>
                <header className="relative z-10 py-5 px-6 sm:px-8 border-b border-[#3A3D42] bg-[#26282B]/90 backdrop-blur-md">
                    <div className="max-w-6xl mx-auto flex items-center justify-between">
                        <a href="/" className="flex items-center gap-2.5">
                            <LogoMark />
                            <span className="font-bold tracking-tight text-base">PluginForge</span>
                        </a>
                        <a href="/" className="text-[#a1a1aa] hover:text-[#f4f4f5] text-xs flex items-center gap-1.5 transition-colors">
                            <Icon d={ICONS.back} className="w-3.5 h-3.5" />
                            Back to site
                        </a>
                    </div>
                </header>
                <main className="relative z-10 flex-1 flex items-center justify-center px-6 py-12">
                    <div className="w-full max-w-md text-center">
                        <div className="flex justify-center"><LogoMark className="w-10 h-10" /></div>
                        <h1 className="mt-6 text-2xl sm:text-3xl font-bold tracking-tight">Sign in to start building</h1>
                        <p className="mt-3 text-xs sm:text-sm text-[#a1a1aa] leading-relaxed">
                            Your projects are saved to your Discord account, so you can pick them up on any device.
                        </p>
                        <div className="mt-8 bg-[#2C2E31] border border-[#3A3D42] rounded-2xl p-3 shadow-xl">
                            {unavailable ? (
                                <div role="alert" className="px-3 py-4 text-sm text-[#a1a1aa] leading-relaxed">
                                    Sign in isn't available right now. Please try again later.
                                </div>
                            ) : (
                                <a
                                    href={'/api/auth/login?next=' + next}
                                    className="w-full flex items-center justify-center gap-2.5 bg-[#5865F2] hover:bg-[#4752C4] text-white text-sm font-semibold py-2.5 rounded-lg transition-colors"
                                >
                                    <DiscordMark />
                                    Continue with Discord
                                </a>
                            )}
                        </div>
                        <p role="alert" className="mt-4 min-h-[1rem] text-xs text-[#a1a1aa] leading-relaxed">{message}</p>
                        <p className="mt-6 text-[11px] text-[#71717a] leading-relaxed">
                            PluginForge only reads your Discord username, display name, profile picture and account ID. It never sees your password.
                        </p>
                    </div>
                </main>
            </div>
        );
    }

    function FileRow({ f }) {
        return (
            <div className="p-4 flex items-center gap-3.5 hover:bg-[#3A3D42]/30 transition-colors">
                <div className="text-[#a1a1aa] shrink-0">
                    <Icon d={f.locked ? ICONS.code : ICONS.cube} className="w-5 h-5" sw={1.5} />
                </div>
                <div className="min-w-0 flex-1">
                    <div className="flex items-center justify-between gap-2 flex-wrap">
                        <div className="flex items-center gap-2 min-w-0">
                            <span className="font-mono text-sm font-medium text-[#f4f4f5] truncate">{f.name}</span>
                            {f.size && <span className="text-[11px] text-[#71717a] font-mono">{f.size}</span>}
                            {f.locked && <Icon d={ICONS.lock} className="w-3.5 h-3.5 text-[#a1a1aa] shrink-0" />}
                        </div>
                        {f.locked && (
                            <span className="text-[11px] font-medium text-[#a1a1aa] bg-[#26282B] border border-[#3A3D42] px-2.5 py-0.5 rounded">
                                Iron & Diamond tiers
                            </span>
                        )}
                    </div>
                    <p className="text-xs text-[#a1a1aa] mt-0.5">{f.desc}</p>
                </div>
            </div>
        );
    }

    function UserMessage({ m }) {
        return (
            <div className="flex justify-end">
                <div className="max-w-[88%] sm:max-w-[80%] bg-[#2C2E31] border border-[#3A3D42] rounded-2xl rounded-tr-md px-4 py-3 text-sm text-[#f4f4f5] leading-relaxed whitespace-pre-wrap break-words">
                    {m.text}
                </div>
            </div>
        );
    }

    function AssistantMessage({ m }) {
        return (
            <div className="flex gap-3.5">
                <div className="mt-0.5"><LogoMark /></div>
                <div className="min-w-0 flex-1 space-y-4 text-sm text-[#e4e4e7] leading-relaxed">
                    {m.text && <p>{m.text}</p>}
                    {m.points && (
                        <ul className="space-y-2 text-[#a1a1aa]">
                            {m.points.map((p, i) => (
                                <li key={i} className="flex gap-2">
                                    <span className="text-[#71717a] font-mono">•</span>
                                    <span className="min-w-0">{p}</span>
                                </li>
                            ))}
                        </ul>
                    )}
                    {m.commands && (
                        <div className="flex flex-wrap gap-1.5">
                            {m.commands.map((c) => (
                                <span key={c} className="font-mono text-[11px] bg-[#2C2E31] border border-[#3A3D42] px-2 py-1 rounded-md text-[#f4f4f5]">{c}</span>
                            ))}
                        </div>
                    )}
                    {m.files && (
                        <div className="bg-[#2C2E31] border border-[#3A3D42] rounded-lg overflow-hidden divide-y divide-[#3A3D42]">
                            {m.files.map((f) => <FileRow key={f.name} f={f} />)}
                        </div>
                    )}
                    {m.after && <p>{m.after}</p>}
                </div>
            </div>
        );
    }

    function TypingIndicator() {
        return (
            <div className="flex gap-3.5 items-center" aria-label="PluginForge is replying">
                <LogoMark />
                <div className="flex items-center gap-1.5">
                    {[0, 1, 2].map((i) => (
                        <span key={i} className="w-1.5 h-1.5 rounded-full bg-[#a1a1aa] animate-pulse" style={{ animationDelay: `${i * 200}ms` }}></span>
                    ))}
                </div>
            </div>
        );
    }

    function PricingModal({ onClose }) {
        const [isAnnual, setIsAnnual] = React.useState(false);
        const [notice, setNotice] = React.useState('');

        React.useEffect(() => {
            const onKey = (e) => { if (e.key === 'Escape') onClose(); };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
        }, []);

        const choose = () => setNotice("Billing isn't connected yet, so plans can't be changed in this preview.");

        return (
            <div className="fixed inset-0 z-[60] overflow-y-auto bg-black/55 backdrop-blur-xl" onClick={onClose}>
                <button
                    onClick={onClose}
                    className="fixed right-4 z-[61] text-[#a1a1aa] hover:text-[#f4f4f5] p-2 rounded-full bg-[#2C2E31]/80 border border-[#3A3D42] backdrop-blur-md transition-colors"
                    style={{ top: 'calc(env(safe-area-inset-top, 0px) + 16px)' }}
                    aria-label="Close pricing"
                >
                    <Icon d={ICONS.close} className="w-5 h-5" />
                </button>

                <div className="min-h-full flex items-center justify-center px-4 py-20">
                    <div
                        role="dialog"
                        aria-modal="true"
                        aria-label="Pricing tiers"
                        onClick={(e) => e.stopPropagation()}
                        className="w-full max-w-4xl"
                    >
                        <div className="text-center">
                            <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight text-[#f4f4f5]">Pricing Tiers</h2>
                            <p className="mt-2 text-xs sm:text-sm text-[#a1a1aa]">You are on the Stone Tier.</p>
                        </div>

                        {/* Monthly / Annual Billing Toggle */}
                        <div className="mt-6 mb-10 flex justify-center">
                            <div className="inline-flex items-center gap-3 bg-[#2C2E31]/80 border border-[#3A3D42] backdrop-blur-md rounded-full pl-4 pr-3 py-1.5">
                                <span className={`text-xs font-medium transition-colors ${!isAnnual ? 'text-[#f4f4f5]' : 'text-[#a1a1aa]'}`}>
                                    Monthly
                                </span>
                                <button
                                    onClick={() => setIsAnnual(!isAnnual)}
                                    className="w-12 h-6 bg-[#26282B] border border-[#3A3D42] rounded-full p-0.5 relative transition-colors focus:outline-none"
                                    aria-label="Toggle billing cycle"
                                >
                                    <div className={`w-4 h-4 bg-[#f4f4f5] rounded-full transition-transform duration-200 ease-in-out ${isAnnual ? 'translate-x-6' : 'translate-x-0'}`}></div>
                                </button>
                                <span className={`text-xs font-medium transition-colors ${isAnnual ? 'text-[#f4f4f5]' : 'text-[#a1a1aa]'}`}>
                                    Annual
                                </span>
                                <span className="text-[10px] font-mono text-[#26282B] bg-[#f4f4f5] font-bold px-2 py-0.5 rounded-full">
                                    Save 20%
                                </span>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-stretch">
                            <div className="bg-[#2C2E31] border border-[#3A3D42] rounded-xl p-6 flex flex-col justify-between shadow-2xl shadow-black/40">
                                <div>
                                    <div className="text-sm font-medium text-[#f4f4f5]">Stone Tier</div>
                                    <div className="mt-3 text-2xl sm:text-3xl font-semibold text-[#f4f4f5]">$0</div>
                                    <ul className="mt-6 space-y-3 text-xs text-[#a1a1aa] border-t border-[#3A3D42] pt-4">
                                        <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> 5 plugin generations/day</li>
                                        <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> Compiled .jar download</li>
                                        <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> Automated error self-healing</li>
                                    </ul>
                                </div>
                                <div className="mt-6 pt-4">
                                    <div className="w-full text-center bg-[#26282B] border border-[#3A3D42] text-[#71717a] text-xs font-semibold py-2 rounded">
                                        Current plan
                                    </div>
                                </div>
                            </div>

                            <div className="bg-[#2C2E31] border border-[#f4f4f5]/50 rounded-xl p-6 flex flex-col justify-between relative md:scale-105 md:z-10 shadow-2xl shadow-black/60">
                                <div>
                                    <div className="flex items-center justify-between">
                                        <span className="text-sm font-semibold text-[#f4f4f5]">Iron Tier</span>
                                        <span className="text-[10px] font-mono text-[#26282B] bg-[#f4f4f5] px-2.5 py-0.5 rounded-full font-semibold">Popular</span>
                                    </div>
                                    <div className="mt-3 text-2xl sm:text-3xl font-semibold text-[#f4f4f5]">
                                        {isAnnual ? "$7.99" : "$9.99"}
                                        <span className="text-xs font-normal text-[#a1a1aa]">/mo</span>
                                    </div>
                                    {isAnnual && (
                                        <div className="text-[11px] text-[#a1a1aa] mt-1 font-mono">Billed annually ($95.88/yr)</div>
                                    )}
                                    <div className="mt-6 border-t border-[#3A3D42] pt-4">
                                        <p className="text-[11px] text-[#e4e4e7] font-medium mb-3">
                                            Everything in Stone Tier, plus:
                                        </p>
                                        <ul className="space-y-3 text-xs text-[#a1a1aa]">
                                            <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> 250 generations/mo</li>
                                            <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> Full Java source code access</li>
                                            <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> Compile checking</li>
                                        </ul>
                                    </div>
                                </div>
                                <div className="mt-6 pt-4">

                                            <li className="flex items-center gap-2"><span className="text-[#f4f4f5] font-mono">•</span> Project storage & history</li>
                                        </ul>

                                </div>
                                <div className="mt-6 pt-4">
                                    <button onClick={choose} className="w-full text-center bg-[#26282B] hover:bg-[#3A3D42] border border-[#3A3D42] text-[#f4f4f5] text-xs font-semibold py-2 rounded transition-colors">

    function ChatApp({ user, chats, setChats, activeId, setActiveId, loadingProject, onSignOut, onSessionExpired, onUsage }) {
        const [sidebarOpen, setSidebarOpen] = React.useState(false);
        const [query, setQuery] = React.useState('');

        const [showPricing, setShowPricing] = React.useState(() => window.location.hash === '#pricing');
        const [copied, setCopied] = React.useState(false);

        const endRef = React.useRef(null);
        const taRef = React.useRef(null);

        const active = chats.find((c) => c.id === activeId) || null;
        const urlId = getIdFromPath();
        const missingId = !active && !loadingProject && urlId && !chats.some((c) => c.id === urlId) ? urlId : null;
        const messages = active && active.messages ? active.messages : [];
        const isPending = pendingId !== null && pendingId === activeId;
        const needle = query.trim().toLowerCase();

        const groups = CHAT_GROUPS
            .map((g) => ({
                name: g,
                items: chats
                    .filter((c) => groupFor(c.updatedAt || Date.now()) === g && c.title.toLowerCase().includes(needle))
                    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
            }))
            .filter((g) => g.items.length > 0);

        // The sidebar list only has titles, so fetch the conversation when a project is opened
        const needsMessages = Boolean(active) && !active.messages && !active.loadFailed;
        React.useEffect(() => {
            if (!needsMessages) return;
            let cancelled = false;
            const id = active.id;
            api('/' + id, 'GET').then((res) => {
                if (cancelled) return;
                if (res.ok && res.data && Array.isArray(res.data.messages)) {
                    setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: res.data.messages } : c)));
                } else if (res.status === 401) {
                    onSessionExpired();
                } else {
                    setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: [], loadFailed: true } : c)));
                }
            });
            return () => { cancelled = true; };
        }, [activeId, needsMessages]);

        React.useEffect(() => {
            if (endRef.current) endRef.current.scrollIntoView({ block: 'end' });
        }, [messages.length, isPending, activeId]);

        React.useEffect(() => {
            const el = taRef.current;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }, [draft]);

        const selectChat = (id) => {
            setNotice('');
            setActiveId(id);
            navigateTo(id);
            setSidebarOpen(false);
        };

        const newChat = () => {
            setNotice('');
            setActiveId(null);
            navigateTo(null);
            setSidebarOpen(false);
            if (taRef.current) taRef.current.focus();
        };

        const deleteChat = async (id) => {
            setNotice('');
            const res = await api('/' + id, 'DELETE');
            if (res.status === 401) return onSessionExpired();
            if (!res.ok && res.status !== 404) {
                setNotice("Couldn't delete this project. Check your connection and try again.");
                return;
            }
            setChats((prev) => prev.filter((c) => c.id !== id));
            if (activeId === id) {
                setActiveId(null);
                navigateTo(null, true);
            }
        };

        const send = async () => {
            const text = draft.trim();
            if (!text || pendingId) return;
            const userMsg = { role: 'user', text };
            setNotice('');
            setDraft('');

            let id = activeId;
            const title = active ? active.title : (text.length > 44 ? text.slice(0, 44).trimEnd() + '…' : text);
            let msgs;

            if (!active) {
                // Show the chat straight away, then swap in the ID the server assigns
                const tempId = newProjectId();
                id = tempId;
                msgs = [userMsg];
                setChats((prev) => [{ id: tempId, title, updatedAt: Date.now(), messages: msgs }, ...prev]);
                setActiveId(tempId);
                navigateTo(tempId);
                setPendingId(tempId);
                const created = await api('', 'POST', { title, messages: plainMessages(msgs) });
                if (!created.ok) {
                    // Nothing was saved, so take the chat back out and give the message back
                    setChats((prev) => prev.filter((c) => c.id !== tempId));
                    setActiveId(null);
                    navigateTo(null, true);
                    setPendingId(null);
                    setDraft(text);
                    if (created.status === 401) return onSessionExpired();
                    setNotice((created.data && created.data.error) || "Couldn't save your project. Check your connection and try again. Your message is still in the box.");
                    return;
                }
                id = created.data.id;
                if (created.data.usage) onUsage(created.data.usage);
                setChats((prev) => prev.map((c) => (c.id === tempId ? { ...c, id } : c)));
                setActiveId(id);
                navigateTo(id, true);
                setPendingId(id);
            } else {
                msgs = [...active.messages, userMsg];
                setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: msgs, updatedAt: Date.now() } : c)));
                setPendingId(id);
            }

            setTimeout(async () => {
                const reply = { role: 'assistant', text: NOT_CONNECTED };
                setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: [...c.messages, reply], updatedAt: Date.now() } : c)));
                setPendingId(null);
                const saved = await api('/' + id, 'PUT', { title, messages: plainMessages([...msgs, reply]) });

                if (!saved.ok) setNotice("Couldn't save the latest reply to your project.");
                else if (saved.data && saved.data.usage) onUsage(saved.data.usage);

        };

                    setTimeout(() => setCopied(false), 1500);
                }).catch(() => {});
            } catch (e) {}
        };

                send();
            }

                                    className="hidden md:inline-flex items-center gap-1.5 text-[11px] font-mono text-[#a1a1aa] hover:text-[#f4f4f5] bg-[#2C2E31] border border-[#3A3D42] px-2.5 py-1 rounded-md transition-colors"

                            <span className="hidden sm:inline-block text-[11px] font-mono text-[#a1a1aa] bg-[#2C2E31] border border-[#3A3D42] px-2.5 py-1 rounded-md">Paper 1.21.x</span>
                            <a href="/" className="text-[#a1a1aa] hover:text-[#f4f4f5] text-xs flex items-center gap-1.5 px-2 py-1 transition-colors">
                                <Icon d={ICONS.back} className="w-3.5 h-3.5" />

                    </header>

                    <div className="relative z-10 flex-1 min-h-0 overflow-y-auto">

                                    {isPending && <TypingIndicator />}
                                    {active && !active.messages && (

                    {/* Composer */}
                    <div

                        <div className="max-w-3xl mx-auto">

    function App() {
        const [auth, setAuth] = React.useState({ status: 'loading' }); // loading | signedOut | unavailable | signedIn
        const [user, setUser] = React.useState(null);
        const [chats, setChats] = React.useState([]);
        const [activeId, setActiveId] = React.useState(null);
        const [loadingProject, setLoadingProject] = React.useState(true);
        const chatsRef = React.useRef(chats);
        chatsRef.current = chats;

        const loginMessage = (code) => {
            if (code === 'cancelled') return 'Sign in was cancelled.';
            if (code === 'failed') return "Sign in didn't work. Please try again.";
            return '';
        };

        // Open the project named in the address, fetching it if it is not in the sidebar list
        const openFromUrl = React.useCallback(async () => {
            const id = getIdFromPath();
            if (!id) { setActiveId(null); setLoadingProject(false); return; }
            if (chatsRef.current.some((c) => c.id === id)) { setActiveId(id); setLoadingProject(false); return; }
            setLoadingProject(true);
            const res = await api('/' + id, 'GET');
            if (res.ok && res.data && Array.isArray(res.data.messages)) {
                const d = res.data;
                setChats((prev) => prev.some((c) => c.id === id) ? prev : [{ id, title: d.title, updatedAt: d.updatedAt, messages: d.messages }, ...prev]);
                setActiveId(id);
            } else {
                setActiveId(null);
                if (res.status === 401) setAuth({ status: 'signedOut', message: 'Your session ended. Sign in again.' });
            }
            setLoadingProject(false);
        }, []);

        React.useEffect(() => {
            let alive = true;
            (async () => {
                const q = new URLSearchParams(window.location.search);
                const code = q.get('error');
                if (window.location.search) { try { window.history.replaceState({}, '', window.location.pathname); } catch (e) {} }

                let me = null;
                try { me = await fetch('/api/auth/me', { credentials: 'same-origin' }); } catch (e) {}
                if (!alive) return;
                if (me && me.ok) {
                    const u = await me.json();
                    const list = await api('', 'GET');
                    if (!alive) return;
                    setUser(u);
                    setChats(list.ok && list.data && Array.isArray(list.data.projects) ? list.data.projects : []);
                    setAuth({ status: 'signedIn' });
                    openFromUrl();
                } else if (code === 'setup' || (me && me.status === 503)) {
                    setAuth({ status: 'unavailable' });
                } else {
                    setAuth({ status: 'signedOut', message: loginMessage(code) });
                }
            })();
            const onPop = () => { if (chatsRef.current) openFromUrl(); };
            window.addEventListener('popstate', onPop);
            return () => { alive = false; window.removeEventListener('popstate', onPop); };
        }, []);

        const onUsage = React.useCallback((usage) => setUser((u) => (u ? { ...u, usage } : u)), []);

        const onSessionExpired = React.useCallback(() => {
            setAuth({ status: 'signedOut', message: 'Your session ended. Sign in again.' });
            setChats([]);
            setActiveId(null);
        }, []);

        const onSignOut = async () => {
            try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin', headers: { 'x-pf-request': '1' } }); } catch (e) {}
            // Switch screens first. This React setup renders after every change, so clearing the user first would crash the chat.
            setAuth({ status: 'signedOut', message: 'You have been signed out.' });
            setChats([]);
            setActiveId(null);
            navigateTo(null, true);
        };

        if (auth.status === 'loading') return <LoadingScreen />;
        if (auth.status !== 'signedIn') return <SignInScreen unavailable={auth.status === 'unavailable'} message={auth.message || ''} />;
        return (
            <ChatApp
                user={user}
                chats={chats}
                setChats={setChats}
                activeId={activeId}
                setActiveId={setActiveId}
                loadingProject={loadingProject}
                onSignOut={onSignOut}
                onSessionExpired={onSessionExpired}
                onUsage={onUsage}
            />
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
