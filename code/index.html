    function groupFor(ms) {
        const startOfToday = new Date();
        startOfToday.setHours(0, 0, 0, 0);
        const day = 24 * 60 * 60 * 1000;
        const today = startOfToday.getTime();
        if (ms >= today) return "Today";
        if (ms >= today - day) return "Yesterday";
        if (ms >= today - 7 * day) return "Previous 7 days";
        return "Older";
    }

    const ID_CHARS = 'abcdefghijklmnopqrstuvwxyz0123456789';
    const ID_FROM_PATH = /\/([a-z0-9]{16})\/?$/;

    // Placeholder ID shown for a moment until the server assigns the real one
    function newProjectId() {
        let id = '';
        while (id.length < 16) {
            const bytes = new Uint8Array(32);
            crypto.getRandomValues(bytes);
            for (const b of bytes) {
                if (b < 252 && id.length < 16) id += ID_CHARS[b % 36];
            }
        }
        return id;
    }

    function getIdFromPath() {
        const m = window.location.pathname.match(ID_FROM_PATH);
        return m ? m[1] : null;
    }

    // The folder this page lives in, e.g. /code/ (works for any folder name)
    function getBasePath() {
        const path = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/[a-z0-9]{16}\/?$/, '').replace(/\/+$/, '');
        return path + '/';
    }

    function navigateTo(id, replace) {
        try {
            const base = getBasePath();
            const url = id ? base + id : base;
            if (window.location.pathname === url) return;
            window.history[replace ? 'replaceState' : 'pushState']({}, '', url);
        } catch (e) {}
    }

    // ---- Talking to the server (/api/projects). Your Discord sign-in cookie is sent automatically. ----
    async function api(path, method, body) {
        try {
            const r = await fetch('/api/projects' + path, {

                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json', 'x-pf-request': '1' },
                body: body ? JSON.stringify(body) : undefined
            });
            let data = null;
            try { data = await r.json(); } catch (e) {}
            return { ok: r.ok, status: r.status, data };
        } catch (e) {
            return { ok: false, status: 0, data: null };
        }
    }

    function ChatApp({ user, chats, setChats, activeId, setActiveId, loadingProject, onSignOut, onSessionExpired, onUsage }) {
        const [sidebarOpen, setSidebarOpen] = React.useState(false);
        const [query, setQuery] = React.useState('');
        const [draft, setDraft] = React.useState('');
        const [pendingId, setPendingId] = React.useState(null);
        const [showPricing, setShowPricing] = React.useState(() => window.location.hash === '#pricing');
        const [copied, setCopied] = React.useState(false);
        const [notice, setNotice] = React.useState('');
        const endRef = React.useRef(null);
        const taRef = React.useRef(null);

        const active = chats.find((c) => c.id === activeId) || null;
        const urlId = getIdFromPath();
        const missingId = !active && !loadingProject && urlId && !chats.some((c) => c.id === urlId) ? urlId : null;
        const messages = active && active.messages ? active.messages : [];
        const isPending = pendingId !== null && pendingId === activeId;
        const needle = query.trim().toLowerCase();

        const groups = CHAT_GROUPS
            .map((g) => ({
                name: g,
                items: chats
                    .filter((c) => groupFor(c.updatedAt || Date.now()) === g && c.title.toLowerCase().includes(needle))
                    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
            }))
            .filter((g) => g.items.length > 0);

        // The sidebar list only has titles, so fetch the conversation when a project is opened
        const needsMessages = Boolean(active) && !active.messages && !active.loadFailed;
        React.useEffect(() => {
            if (!needsMessages) return;
            let cancelled = false;
            const id = active.id;
            api('/' + id, 'GET').then((res) => {
                if (cancelled) return;
                if (res.ok && res.data && Array.isArray(res.data.messages)) {
                    setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: res.data.messages } : c)));
                } else if (res.status === 401) {
                    onSessionExpired();
                } else {
                    setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: [], loadFailed: true } : c)));
                }
            });
            return () => { cancelled = true; };
        }, [activeId, needsMessages]);

        React.useEffect(() => {
            if (endRef.current) endRef.current.scrollIntoView({ block: 'end' });
        }, [messages.length, isPending, activeId]);

        React.useEffect(() => {
            const el = taRef.current;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }, [draft]);

        const selectChat = (id) => {
            setNotice('');
            setActiveId(id);
            navigateTo(id);
            setSidebarOpen(false);
        };

        const newChat = () => {
            setNotice('');
            setActiveId(null);
            navigateTo(null);
            setSidebarOpen(false);
            if (taRef.current) taRef.current.focus();
        };

        const deleteChat = async (id) => {
            setNotice('');
            const res = await api('/' + id, 'DELETE');
            if (res.status === 401) return onSessionExpired();
            if (!res.ok && res.status !== 404) {
                setNotice("Couldn't delete this project. Check your connection and try again.");
                return;
            }
            setChats((prev) => prev.filter((c) => c.id !== id));
            if (activeId === id) {
                setActiveId(null);
                navigateTo(null, true);
            }
        };

        const send = async () => {
            const text = draft.trim();
            if (!text || pendingId) return;
            const userMsg = { role: 'user', text };
            setNotice('');
            setDraft('');

            let id = activeId;
            const title = active ? active.title : (text.length > 44 ? text.slice(0, 44).trimEnd() + '…' : text);
            let msgs;

            if (!active) {
                // Show the chat straight away, then swap in the ID the server assigns
                const tempId = newProjectId();
                id = tempId;
                msgs = [userMsg];
                setChats((prev) => [{ id: tempId, title, updatedAt: Date.now(), messages: msgs }, ...prev]);
                setActiveId(tempId);
                navigateTo(tempId);
                setPendingId(tempId);
                const created = await api('', 'POST', { title, messages: plainMessages(msgs) });
                if (!created.ok) {
                    // Nothing was saved, so take the chat back out and give the message back
                    setChats((prev) => prev.filter((c) => c.id !== tempId));
                    setActiveId(null);
                    navigateTo(null, true);
                    setPendingId(null);
                    setDraft(text);
                    if (created.status === 401) return onSessionExpired();
                    setNotice((created.data && created.data.error) || "Couldn't save your project. Check your connection and try again. Your message is still in the box.");
                    return;
                }
                id = created.data.id;
                if (created.data.usage) onUsage(created.data.usage);
                setChats((prev) => prev.map((c) => (c.id === tempId ? { ...c, id } : c)));
                setActiveId(id);
                navigateTo(id, true);
                setPendingId(id);
            } else {
                msgs = [...active.messages, userMsg];
                setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: msgs, updatedAt: Date.now() } : c)));
                setPendingId(id);
            }

            setTimeout(async () => {
                const reply = { role: 'assistant', text: NOT_CONNECTED };
                setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: [...c.messages, reply], updatedAt: Date.now() } : c)));
                setPendingId(null);
                const saved = await api('/' + id, 'PUT', { title, messages: plainMessages([...msgs, reply]) });
                if (saved.status === 401) return onSessionExpired();
                if (!saved.ok) setNotice("Couldn't save the latest reply to your project.");
                else if (saved.data && saved.data.usage) onUsage(saved.data.usage);
            }, 1100);
        };

        const copyId = () => {
            if (!active) return;
            try {
                navigator.clipboard.writeText(active.id).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1500);
                }).catch(() => {});
            } catch (e) {}
        };

        const onKeyDown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        };

        return (
            <div className="h-full flex bg-[#26282B] text-[#f4f4f5] font-sans overflow-hidden relative">
                {showPricing && <PricingModal onClose={() => setShowPricing(false)} />}

                {/* Mobile backdrop */}
                {sidebarOpen && (
                    <div
                        className="fixed inset-0 bg-black/60 z-40 md:hidden"
                        onClick={() => setSidebarOpen(false)}
                    ></div>
                )}

                {/* Sidebar */}
                <aside
                    className={`fixed md:static inset-y-0 left-0 z-50 w-72 max-w-[85vw] shrink-0 flex flex-col bg-[#2C2E31] border-r border-[#3A3D42] transform transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}
                    style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}
                >
                    <div className="px-4 py-4 flex items-center justify-between">
                        <a href="/" className="flex items-center gap-2.5">
                            <LogoMark />
                            <span className="font-bold tracking-tight text-base text-[#f4f4f5]">PluginForge</span>
                        </a>
                        <button
                            onClick={() => setSidebarOpen(false)}
                            className="md:hidden text-[#a1a1aa] hover:text-[#f4f4f5] p-1.5 rounded-md border border-[#3A3D42] bg-[#26282B] transition-colors"
                            aria-label="Close sidebar"
                        >
                            <Icon d={ICONS.close} className="w-4 h-4" />
                        </button>
                    </div>

                    <div className="px-3 space-y-2.5">
                        <button
                            onClick={newChat}
                            className="w-full bg-[#f4f4f5] hover:bg-[#e4e4e7] text-[#26282B] text-xs font-semibold py-2 rounded transition-colors flex items-center justify-center gap-1.5"
                        >
                            <Icon d={ICONS.plus} className="w-3.5 h-3.5" sw={2.5} />
                            New plugin
                        </button>
                        <div className="flex items-center gap-2 bg-[#26282B] border border-[#3A3D42] focus-within:border-[#71717a] rounded-md px-2.5 py-1.5 transition-colors">
                            <Icon d={ICONS.search} className="w-3.5 h-3.5 text-[#71717a] shrink-0" />
                            <input
                                id="chat-search"
                                type="text"
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder="Search chats"
                                className="w-full min-w-0 bg-transparent text-xs text-[#f4f4f5] placeholder-[#71717a] focus:outline-none"
                            />
                        </div>
                    </div>

                    <nav className="flex-1 min-h-0 overflow-y-auto px-3 pt-5 pb-3 space-y-5" aria-label="Chats">
                        {groups.length === 0 && (
                            <p className="px-2 text-xs text-[#71717a] leading-relaxed">{chats.length === 0 ? "No chats yet. Describe a plugin to start your first one." : "No chats match your search."}</p>
                        )}
                        {groups.map((g) => (
                            <div key={g.name}>
                                <div className="px-2 mb-1.5 text-[11px] font-mono uppercase tracking-wider text-[#71717a]">{g.name}</div>
                                <ul className="space-y-0.5">
                                    {g.items.map((c) => (
                                        <li key={c.id} className="group relative">
                                            <button
                                                onClick={() => selectChat(c.id)}
                                                className={`w-full text-left text-[13px] pl-2.5 pr-8 py-2 rounded-md truncate transition-colors ${c.id === activeId ? 'bg-[#3A3D42] text-[#f4f4f5]' : 'text-[#a1a1aa] hover:bg-[#3A3D42]/50 hover:text-[#f4f4f5]'}`}
                                            >
                                                {c.title}
                                            </button>
                                            <button
                                                onClick={() => deleteChat(c.id)}
                                                className={`absolute right-1.5 top-1/2 -translate-y-1/2 p-1 rounded text-[#a1a1aa] hover:text-[#f4f4f5] hover:bg-[#26282B] transition-opacity focus:opacity-100 ${c.id === activeId ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
                                                aria-label={`Delete ${c.title}`}
                                            >
                                                <Icon d={ICONS.trash} className="w-3.5 h-3.5" sw={1.75} />
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </nav>

                    {/* User card */}
                    <div className="border-t border-[#3A3D42] p-3 space-y-3">
                        {user.usage && (
                            <div>
                                <div className="flex items-center justify-between text-[11px] font-mono text-[#71717a] mb-1.5">
                                    <span>{user.usage.tierName} Tier</span>
                                    <span className="text-[#a1a1aa]">{user.usage.left} / {Math.max(user.usage.limit, user.usage.left)} prompts left{user.usage.period === 'day' ? '' : ' this month'}</span>
                                </div>
                                <div className="h-1 rounded-full bg-[#3A3D42] overflow-hidden">
                                    <div className="h-full bg-[#f4f4f5] rounded-full" style={{ width: Math.max(0, Math.min(100, (user.usage.left / Math.max(user.usage.limit, user.usage.left)) * 100)) + '%' }}></div>
                                </div>
                            </div>
                        )}
                        <div className="flex items-center gap-3 p-1.5 -m-1.5 rounded-lg">
                            <Avatar user={user} />
                            <div className="min-w-0 flex-1">
                                <div className="text-sm font-medium text-[#f4f4f5] truncate" title={user.name}>{user.name}</div>
                                <div className="text-[11px] font-mono text-[#71717a] truncate" title={user.username ? '@' + user.username : ''}>{user.username ? '@' + user.username : 'Discord account'}</div>
                            </div>
                            <button onClick={() => setShowPricing(true)} className="bg-[#26282B] hover:bg-[#3A3D42] border border-[#3A3D42] text-[#f4f4f5] text-[11px] font-medium px-2.5 py-1 rounded transition-colors shrink-0">
                                Upgrade
                            </button>
                            <button onClick={onSignOut} className="text-[#a1a1aa] hover:text-[#f4f4f5] p-1.5 rounded-md border border-[#3A3D42] bg-[#26282B] transition-colors shrink-0" aria-label="Sign out" title="Sign out">
                                <Icon d={ICONS.signout} className="w-3.5 h-3.5" />
                            </button>
                        </div>
                    </div>
                </aside>

                {/* Main chat area */}
                <main className="flex-1 min-w-0 flex flex-col relative">
                    <div className="absolute inset-0 bg-grid-pattern opacity-30 pointer-events-none z-0"></div>

                    <header
                        className="relative z-10 h-14 px-4 sm:px-6 border-b border-[#3A3D42] bg-[#26282B]/90 backdrop-blur-md flex items-center gap-3 shrink-0"
                    >
                        <button
                            onClick={() => setSidebarOpen(true)}
                            className="md:hidden text-[#a1a1aa] hover:text-[#f4f4f5] p-1.5 rounded-md border border-[#3A3D42] bg-[#2C2E31] transition-colors"
                            aria-label="Open sidebar"
                        >
                            <Icon d={ICONS.menu} className="w-4 h-4" />
                        </button>
                        <h1 className="text-sm font-medium text-[#f4f4f5] truncate min-w-0">
                            {active ? active.title : 'New plugin'}
                        </h1>
                        <span className="text-[10px] font-mono text-[#26282B] bg-[#f4f4f5] px-2.5 py-0.5 rounded-full font-semibold shrink-0">Preview</span>
                        <div className="ml-auto flex items-center gap-2 shrink-0">
                            {active && (
                                <button
                                    onClick={copyId}
                                    title="Copy project ID"
                                    className="hidden md:inline-flex items-center gap-1.5 text-[11px] font-mono text-[#a1a1aa] hover:text-[#f4f4f5] bg-[#2C2E31] border border-[#3A3D42] px-2.5 py-1 rounded-md transition-colors"
                                >
                                    <span className="text-[#71717a]">ID</span>
                                    {copied ? 'Copied' : active.id}
                                </button>
                            )}
                            <span className="hidden sm:inline-block text-[11px] font-mono text-[#a1a1aa] bg-[#2C2E31] border border-[#3A3D42] px-2.5 py-1 rounded-md">Paper 1.21.x</span>
                            <a href="/" className="text-[#a1a1aa] hover:text-[#f4f4f5] text-xs flex items-center gap-1.5 px-2 py-1 transition-colors">
                                <Icon d={ICONS.back} className="w-3.5 h-3.5" />
                                <span className="hidden sm:inline">Back to site</span>
                            </a>
                        </div>
                    </header>

                    <div className="relative z-10 flex-1 min-h-0 overflow-y-auto">
                        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8 min-h-full flex flex-col">
                            {!active && (
                                <div className="flex-1 flex flex-col items-center justify-center text-center py-10">
                                    {missingId && (
                                        <div role="status" className="mb-8 max-w-md bg-[#2C2E31] border border-[#3A3D42] rounded-lg px-4 py-3 text-xs text-[#a1a1aa] leading-relaxed">
                                            No project found with the ID <span className="font-mono text-[#f4f4f5] break-all">{missingId}</span>. It may have been deleted, or it was created in a different browser.
                                        </div>
                                    )}
                                    <LogoMark className="h-10" />
                                    <h2 className="mt-6 text-2xl sm:text-3xl font-bold tracking-tight text-[#f4f4f5]">What do you want to build?</h2>
                                    <p className="mt-3 max-w-md text-xs sm:text-sm text-[#a1a1aa] leading-relaxed">
                                        Describe the plugin in plain English. PluginForge will turn it into a Paper plugin you can drop into your server.
                                    </p>
                                    <div className="mt-8 w-full grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
                                        {SUGGESTIONS.map((s) => (
                                            <button
                                                key={s.title}
                                                onClick={() => {
                                                    setDraft(s.text);
                                                    if (taRef.current) taRef.current.focus();
                                                }}
                                                className="bg-[#2C2E31] hover:bg-[#3A3D42]/60 border border-[#3A3D42] rounded-lg p-4 transition-colors"
                                            >
                                                <div className="text-sm font-medium text-[#f4f4f5] mb-1">{s.title}</div>
                                                <div className="text-xs text-[#a1a1aa] leading-relaxed">{s.text}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {active && (
                                <div className="space-y-8">
                                    {messages.map((m, i) =>
                                        m.role === 'user'
                                            ? <UserMessage key={i} m={m} />
                                            : <AssistantMessage key={i} m={m} />
                                    )}
                                    {isPending && <TypingIndicator />}
                                    {active && !active.messages && (
                                        <p role="status" className="text-xs text-[#71717a]">Loading project…</p>
                                    )}
                                    {active && active.loadFailed && (
                                        <p role="alert" className="text-xs text-[#a1a1aa]">Couldn't load this project. Check your connection and open it again.</p>
                                    )}
                                </div>
                            )}
                            <div ref={endRef}></div>
                        </div>
                    </div>

                    {/* Composer */}
                    <div
                        className="relative z-10 px-4 sm:px-6 pt-2 pb-4 shrink-0"
                    >
                        <div className="max-w-3xl mx-auto">
                            {notice && (
                                <div role="alert" className="mb-2.5 bg-[#2C2E31] border border-[#3A3D42] rounded-lg px-3.5 py-2.5 text-xs text-[#a1a1aa] leading-relaxed">{notice}</div>
                            )}
                            <div className="bg-[#2C2E31] border border-[#3A3D42] rounded-2xl p-3 shadow-xl">
                                <div className="bg-[#26282B] border border-[#3A3D42] focus-within:border-[#71717a] rounded-xl p-2 transition-all">
                                    <textarea
                                        id="chat-input"
                                        ref={taRef}
                                        rows={1}
                                        maxLength={500}
                                        value={draft}
                                        onChange={(e) => setDraft(e.target.value)}
                                        onKeyDown={onKeyDown}
                                        placeholder={active ? 'Ask for a change, or describe another plugin...' : 'Describe the plugin you want to generate...'}
                                        className="w-full resize-none bg-transparent text-sm text-[#f4f4f5] placeholder-[#71717a] focus:outline-none px-2 py-1.5 leading-relaxed"
                                    ></textarea>
                                    <div className="flex items-center justify-between gap-3 px-2 pt-1">
                                        <span className="text-[11px] font-mono text-[#71717a]">{draft.length}/500</span>
                                        <button
                                            onClick={send}
                                            disabled={!draft.trim() || pendingId !== null}
                                            className="bg-[#f4f4f5] hover:bg-[#e4e4e7] disabled:bg-[#3A3D42] disabled:text-[#71717a] disabled:cursor-not-allowed text-[#26282B] p-2.5 rounded-lg transition-colors flex items-center justify-center shrink-0"
                                            aria-label="Send"
                                        >
                                            <Icon d={ICONS.send} className="w-4 h-4" sw={2.5} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <p className="mt-2.5 text-center text-[11px] text-[#71717a]">
                                Test generated plugins on a staging server before running them with real players.
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    }


    function App() {
        const [auth, setAuth] = React.useState({ status: 'loading' }); // loading | signedOut | unavailable | signedIn
        const [user, setUser] = React.useState(null);
        const [chats, setChats] = React.useState([]);
        const [activeId, setActiveId] = React.useState(null);
        const [loadingProject, setLoadingProject] = React.useState(true);
        const chatsRef = React.useRef(chats);
        chatsRef.current = chats;

        const loginMessage = (code) => {
            if (code === 'cancelled') return 'Sign in was cancelled.';
            if (code === 'failed') return "Sign in didn't work. Please try again.";
            return '';
        };

        // Open the project named in the address, fetching it if it is not in the sidebar list
        const openFromUrl = React.useCallback(async () => {
            const id = getIdFromPath();
            if (!id) { setActiveId(null); setLoadingProject(false); return; }
            if (chatsRef.current.some((c) => c.id === id)) { setActiveId(id); setLoadingProject(false); return; }
            setLoadingProject(true);
            const res = await api('/' + id, 'GET');
            if (res.ok && res.data && Array.isArray(res.data.messages)) {
                const d = res.data;
                setChats((prev) => prev.some((c) => c.id === id) ? prev : [{ id, title: d.title, updatedAt: d.updatedAt, messages: d.messages }, ...prev]);
                setActiveId(id);
            } else {
                setActiveId(null);
                if (res.status === 401) setAuth({ status: 'signedOut', message: 'Your session ended. Sign in again.' });
            }
            setLoadingProject(false);
        }, []);

        React.useEffect(() => {
            let alive = true;
            (async () => {
                const q = new URLSearchParams(window.location.search);
                const code = q.get('error');
                if (window.location.search) { try { window.history.replaceState({}, '', window.location.pathname); } catch (e) {} }

                let me = null;
                try { me = await fetch('/api/auth/me', { credentials: 'same-origin' }); } catch (e) {}
                if (!alive) return;
                if (me && me.ok) {
                    const u = await me.json();
                    const list = await api('', 'GET');
                    if (!alive) return;
                    setUser(u);
                    setChats(list.ok && list.data && Array.isArray(list.data.projects) ? list.data.projects : []);
                    setAuth({ status: 'signedIn' });
                    openFromUrl();
                } else if (code === 'setup' || (me && me.status === 503)) {
                    setAuth({ status: 'unavailable' });
                } else {
                    setAuth({ status: 'signedOut', message: loginMessage(code) });
                }
            })();
            const onPop = () => { if (chatsRef.current) openFromUrl(); };
            window.addEventListener('popstate', onPop);
            return () => { alive = false; window.removeEventListener('popstate', onPop); };
        }, []);

        const onUsage = React.useCallback((usage) => setUser((u) => (u ? { ...u, usage } : u)), []);

        const onSessionExpired = React.useCallback(() => {
            setAuth({ status: 'signedOut', message: 'Your session ended. Sign in again.' });
            setChats([]);
            setActiveId(null);
        }, []);

        const onSignOut = async () => {
            try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin', headers: { 'x-pf-request': '1' } }); } catch (e) {}
            // Switch screens first. This React setup renders after every change, so clearing the user first would crash the chat.
            setAuth({ status: 'signedOut', message: 'You have been signed out.' });
            setChats([]);
            setActiveId(null);
            navigateTo(null, true);
        };

        if (auth.status === 'loading') return <LoadingScreen />;
        if (auth.status !== 'signedIn') return <SignInScreen unavailable={auth.status === 'unavailable'} message={auth.message || ''} />;
        return (
            <ChatApp
                user={user}
                chats={chats}
                setChats={setChats}
                activeId={activeId}
                setActiveId={setActiveId}
                loadingProject={loadingProject}
                onSignOut={onSignOut}
                onSessionExpired={onSessionExpired}
                onUsage={onUsage}
            />
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
