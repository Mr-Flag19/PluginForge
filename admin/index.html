
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PluginForge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233A3D42'/%3E%3Cpath d='M11 11l5 5-5 5m7 0h4' fill='none' stroke='%23f4f4f5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root { color-scheme: dark; --bg: #26282B; --fg: #f4f4f5; }
    body { margin: 0; font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif; background-color: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .bg-grid-pattern { background-image: radial-gradient(#3A3D42 1px, transparent 1px); background-size: 24px 24px; }
    ::selection { background: #3A3D42; color: #f4f4f5; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #26282B; }
    ::-webkit-scrollbar-thumb { background: #3A3D42; border-radius: 3px; }
</style>
</head>
<body class="min-h-screen">
<div class="fixed inset-0 bg-grid-pattern opacity-30 pointer-events-none"></div>

<header class="relative z-10 px-4 sm:px-8 py-4 border-b border-[#3A3D42] bg-[#26282B]/90 backdrop-blur-md flex items-center justify-between gap-3">
    <a href="/" class="flex items-center gap-2.5">
        <div class="w-7 h-7 bg-[#3A3D42] rounded-md flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3" /></svg>
        </div>
        <span class="font-bold tracking-tight text-base">PluginForge</span>
        <span class="text-[10px] font-mono text-[#26282B] bg-[#f4f4f5] px-2.5 py-0.5 rounded-full font-semibold">Admin</span>
    </a>
    <div class="flex items-center gap-3 min-w-0">
        <span id="who" hidden class="hidden sm:block text-xs text-[#a1a1aa] truncate"></span>
        <button id="signout" hidden class="text-xs text-[#a1a1aa] hover:text-[#f4f4f5] bg-[#2C2E31] border border-[#3A3D42] px-3 py-1.5 rounded transition-colors shrink-0">Sign out</button>
    </div>
</header>

<main class="relative z-10 max-w-5xl mx-auto px-4 sm:px-8 py-10">

    <!-- Sign in -->
    <section id="login" class="max-w-md mx-auto mt-10">
        <h1 class="text-2xl font-semibold tracking-tight">Admin sign in</h1>
        <p class="mt-2 text-sm text-[#a1a1aa] leading-relaxed">Sign in with a Discord account that is on the admin list. Other accounts can use the site but not this page.</p>
        <div class="mt-6 bg-[#2C2E31] border border-[#3A3D42] rounded-2xl p-3">
            <a id="signin-btn" href="/api/auth/login?next=/admin/" class="w-full flex items-center justify-center gap-2.5 bg-[#5865F2] hover:bg-[#4752C4] text-white text-sm font-semibold py-2.5 rounded-lg transition-colors">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.011c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                Continue with Discord
            </a>
        </div>
        <p id="login-error" role="alert" class="mt-3 text-xs text-[#a1a1aa] leading-relaxed min-h-[1rem] break-words"></p>
    </section>

    <!-- Lookup -->
    <section id="panel" hidden>
        <h1 class="text-2xl font-semibold tracking-tight">Project lookup</h1>
        <p class="mt-2 text-sm text-[#a1a1aa]">Paste a 16 character project ID to see its full conversation.</p>

        <form id="lookup-form" class="mt-6 bg-[#2C2E31] border border-[#3A3D42] rounded-2xl p-3 shadow-xl">
            <div class="bg-[#26282B] border border-[#3A3D42] focus-within:border-[#71717a] rounded-xl p-2 flex items-center gap-2 transition-all">
                <input id="lookup-id" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="e.g. hbg9tqvflyx0kp57" class="w-full min-w-0 bg-transparent text-sm placeholder-[#71717a] focus:outline-none px-2 py-1.5 font-mono">
                <span id="lookup-count" class="text-[11px] font-mono text-[#71717a] shrink-0">0/16</span>
                <button type="submit" class="bg-[#f4f4f5] hover:bg-[#e4e4e7] text-[#26282B] text-xs font-semibold px-4 py-2 rounded-lg transition-colors shrink-0">Look up</button>
            </div>
        </form>
        <p id="lookup-error" role="alert" class="mt-3 text-xs text-[#a1a1aa] min-h-[1rem]"></p>

        <!-- Result -->
        <div id="result" hidden class="mt-6 bg-[#2C2E31] border border-[#3A3D42] rounded-lg overflow-hidden">
            <div class="p-5 border-b border-[#3A3D42] bg-[#26282B] flex flex-wrap items-start justify-between gap-3">
                <div class="min-w-0">
                    <h2 id="r-title" class="text-base font-semibold break-words"></h2>
                    <p id="r-id" class="mt-1 text-[11px] font-mono text-[#71717a] break-all"></p>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button id="r-copy" class="text-xs text-[#a1a1aa] hover:text-[#f4f4f5] bg-[#2C2E31] border border-[#3A3D42] px-3 py-1.5 rounded transition-colors">Copy ID</button>
                    <button id="r-delete" class="text-xs text-[#a1a1aa] hover:text-[#f4f4f5] bg-[#2C2E31] border border-[#3A3D42] px-3 py-1.5 rounded transition-colors">Delete</button>
                </div>
            </div>
            <dl class="grid grid-cols-1 sm:grid-cols-3 gap-px bg-[#3A3D42] text-xs">
                <div class="bg-[#2C2E31] p-4 min-w-0"><dt class="font-mono uppercase tracking-wider text-[#71717a] mb-1">Created</dt><dd id="r-created" class="text-[#f4f4f5]"></dd></div>
                <div class="bg-[#2C2E31] p-4 min-w-0"><dt class="font-mono uppercase tracking-wider text-[#71717a] mb-1">Last updated</dt><dd id="r-updated" class="text-[#f4f4f5]"></dd></div>
                <div class="bg-[#2C2E31] p-4 min-w-0"><dt class="font-mono uppercase tracking-wider text-[#71717a] mb-1">Account</dt><dd id="r-owner" class="font-mono text-[#f4f4f5] break-all"></dd></div>
            </dl>
            <div id="r-messages" class="p-5 space-y-4 border-t border-[#3A3D42]"></div>
        </div>

        <!-- Recent -->
        <div class="mt-10 flex items-baseline justify-between gap-3">
            <h2 class="text-lg font-semibold tracking-tight">Recent projects</h2>
            <span id="recent-total" class="text-[11px] font-mono text-[#71717a]"></span>
        </div>
        <div class="mt-4 bg-[#2C2E31] border border-[#3A3D42] rounded-lg overflow-hidden">
            <ul id="recent" class="divide-y divide-[#3A3D42]"></ul>
        </div>
    </section>
</main>

<script>
(function () {
    var $ = function (id) { return document.getElementById(id); };

    function fmt(ms) {
        return new Date(ms).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
    }

    async function adminFetch(query, method) {
        var r = await fetch('/api/admin/projects' + query, {
            method: method || 'GET',
            credentials: 'same-origin',
            headers: { 'x-pf-request': '1' }
        });
        var data = {};
        try { data = await r.json(); } catch (e) {}
        return { ok: r.ok, status: r.status, data: data };
    }

    function show(signedIn) {
        $('login').hidden = signedIn;
        $('panel').hidden = !signedIn;
        $('signout').hidden = !signedIn;
    }

    function signedOutView(message) {
        show(false);
        $('who').hidden = true;
        $('login-error').textContent = message || '';
        $('result').hidden = true;
    }

    async function signOut() {
        try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin', headers: { 'x-pf-request': '1' } }); } catch (e) {}
        signedOutView('You have been signed out.');
    }

    async function loadRecent() {
        var res = await adminFetch('');
        if (res.status === 401) return signedOutView('Your session ended. Sign in again.');
        if (res.status === 403) return signedOutView('This account is not an admin.');
        var list = $('recent');
        list.textContent = '';
        if (!res.ok) {
            $('recent-total').textContent = '';
            var err = document.createElement('li');
            err.className = 'p-4 text-xs text-[#a1a1aa]';
            err.textContent = res.data.error || 'Could not load projects.';
            list.appendChild(err);
            return;
        }
        $('recent-total').textContent = res.data.total + (res.data.total === 1 ? ' project' : ' projects') + ' in total';
        if (res.data.projects.length === 0) {
            var empty = document.createElement('li');
            empty.className = 'p-4 text-xs text-[#a1a1aa]';
            empty.textContent = 'No projects yet. They appear here once someone starts a chat on the projects page.';
            list.appendChild(empty);
            return;
        }
        res.data.projects.forEach(function (p) {
            var li = document.createElement('li');
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'w-full text-left p-4 flex items-center justify-between gap-4 hover:bg-[#3A3D42]/30 transition-colors';
            var left = document.createElement('div');
            left.className = 'min-w-0';
            var title = document.createElement('div');
            title.className = 'text-sm font-medium truncate';
            title.textContent = p.title;
            var meta = document.createElement('div');
            meta.className = 'mt-0.5 text-[11px] font-mono text-[#71717a] truncate';
            meta.textContent = p.id + ' · ' + (p.ownerName || 'Unknown account') + ' · ' + p.messageCount + (p.messageCount === 1 ? ' message' : ' messages');
            left.appendChild(title);
            left.appendChild(meta);
            var when = document.createElement('div');
            when.className = 'text-[11px] text-[#a1a1aa] shrink-0';
            when.textContent = fmt(p.updatedAt);
            btn.appendChild(left);
            btn.appendChild(when);
            btn.addEventListener('click', function () {
                $('lookup-id').value = p.id;
                $('lookup-count').textContent = '16/16';
                lookup(p.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            li.appendChild(btn);
            list.appendChild(li);
        });
    }

    function renderProject(p) {
        $('r-title').textContent = p.title;
        $('r-id').textContent = p.id;
        $('r-created').textContent = fmt(p.createdAt);
        $('r-updated').textContent = fmt(p.updatedAt);
        $('r-owner').textContent = (p.ownerName ? p.ownerName + ' · ' : '') + (p.ownerUsername ? '@' + p.ownerUsername + ' · ' : '') + p.ownerId;
        var box = $('r-messages');
        box.textContent = '';
        p.messages.forEach(function (m) {
            var row = document.createElement('div');
            var who = document.createElement('div');
            who.className = 'text-[11px] font-mono uppercase tracking-wider text-[#71717a] mb-1';
            who.textContent = m.role === 'user' ? 'User' : 'PluginForge';
            var body = document.createElement('div');
            body.className = 'text-sm leading-relaxed whitespace-pre-wrap break-words ' + (m.role === 'user' ? 'text-[#f4f4f5]' : 'text-[#a1a1aa]');
            body.textContent = m.text;
            row.appendChild(who);
            row.appendChild(body);
            box.appendChild(row);
        });
        $('r-delete').textContent = 'Delete';
        $('r-delete').dataset.confirm = '';
        $('result').hidden = false;
    }

    async function lookup(id) {
        $('lookup-error').textContent = '';
        $('result').hidden = true;
        id = id.trim().toLowerCase();
        if (!/^[a-z0-9]{16}$/.test(id)) {
            $('lookup-error').textContent = 'A project ID is exactly 16 letters and numbers.';
            return;
        }
        var res = await adminFetch('?id=' + encodeURIComponent(id));
        if (res.status === 401) return signedOutView('Your session ended. Sign in again.');
        if (res.status === 403) return signedOutView('This account is not an admin.');
        if (!res.ok) {
            $('lookup-error').textContent = res.data.error || 'Lookup failed.';
            return;
        }
        renderProject(res.data);
    }

    $('lookup-form').addEventListener('submit', function (e) { e.preventDefault(); lookup($('lookup-id').value); });
    $('lookup-id').addEventListener('input', function () { $('lookup-count').textContent = this.value.length + '/16'; });
    $('signout').addEventListener('click', function () { signOut(); });

    $('r-copy').addEventListener('click', function () {
        var btn = this;
        try {
            navigator.clipboard.writeText($('r-id').textContent).then(function () {
                btn.textContent = 'Copied';
                setTimeout(function () { btn.textContent = 'Copy ID'; }, 1500);
            }).catch(function () {});
        } catch (e) {}
    });

    // Two clicks to delete: the first asks, the second does it
    $('r-delete').addEventListener('click', async function () {
        var btn = this;
        if (!btn.dataset.confirm) {
            btn.dataset.confirm = '1';
            btn.textContent = 'Click again to delete';
            return;
        }
        var res = await adminFetch('?id=' + encodeURIComponent($('r-id').textContent), 'DELETE');
        if (res.ok) {
            $('result').hidden = true;
            $('lookup-error').textContent = 'Project deleted.';
            loadRecent();
        } else {
            btn.dataset.confirm = '';
            btn.textContent = 'Delete';
            $('lookup-error').textContent = res.data.error || 'Could not delete the project.';
        }
    });

    // Messages Discord sign-in can send us back with
    function loginMessage() {
        var q = new URLSearchParams(window.location.search);
        var error = q.get('error');
        if (window.location.search) { try { window.history.replaceState({}, '', '/admin/'); } catch (e) {} }
        if (error === 'cancelled') return 'Sign in was cancelled.';
        if (error === 'setup') return 'Admin sign-in is not set up yet. Add the Discord environment variables in Vercel.';
        if (error) return 'Sign in did not work. Try again.';
        return '';
    }

    async function start() {
        var message = loginMessage();
        var me = null;
        try { me = await fetch('/api/auth/me', { credentials: 'same-origin' }); } catch (e) {}
        if (me && me.ok) {
            var user = await me.json();
            if (!user.admin) {
                // Signed in with Discord, but not on the admin list. Show the ID so the owner can add it.
                var id = String(user.id).replace(/[^a-zA-Z0-9-]/g, '');
                signedOutView('You are signed in as ' + user.name + (user.username ? ' (@' + user.username + ')' : '') + ', which is not an admin account. To allow it, add the Discord ID ' + id + ' to ADMIN_ACCOUNTS in Vercel and redeploy. Or sign in with a different account.');
                return;
            }
            $('who').textContent = user.name + (user.username ? ' · @' + user.username : '');
            $('who').hidden = false;
            show(true);
            loadRecent();
        } else if (me && me.status === 503) {
            signedOutView('Admin sign-in is not set up yet. Add the Discord environment variables in Vercel.');
        } else {
            signedOutView(message);
        }
    }

    start();
})();
</script>
</body>
</html>
