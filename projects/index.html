    function ChatApp({ chats, setChats, activeId, setActiveId }) {
        const [sidebarOpen, setSidebarOpen] = React.useState(false);
        const [query, setQuery] = React.useState('');
        const [draft, setDraft] = React.useState('');
        const [pendingId, setPendingId] = React.useState(null);
        const [showPricing, setShowPricing] = React.useState(() => window.location.hash === '#pricing');
        const endRef = React.useRef(null);
        const taRef = React.useRef(null);

        const active = chats.find((c) => c.id === activeId) || null;
        const messages = active ? active.messages : [];
        const isPending = pendingId !== null && pendingId === activeId;

        const groups = CHAT_GROUPS
            .map((g) => ({
                name: g,
                items: chats.filter((c) => c.group === g && c.title.toLowerCase().includes(query.trim().toLowerCase()))
            }))
            .filter((g) => g.items.length > 0);

        React.useEffect(() => {
            if (endRef.current) endRef.current.scrollIntoView({ block: 'end' });
        }, [messages.length, isPending, activeId]);

        React.useEffect(() => {
            const el = taRef.current;
            if (!el) return;
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 160) + 'px';
        }, [draft]);

        const selectChat = (id) => {
            setActiveId(id);
            setSidebarOpen(false);
        };

        const newChat = () => {
            setActiveId(null);
            setSidebarOpen(false);
            if (taRef.current) taRef.current.focus();
        };

        const deleteChat = (id) => {
            setChats((prev) => prev.filter((c) => c.id !== id));
            if (activeId === id) setActiveId(null);
        };

        const send = () => {
            const text = draft.trim();
            if (!text || pendingId) return;
            const userMsg = { role: 'user', text };
            let id = activeId;
            if (!active) {
                id = 'c' + Date.now();
                const title = text.length > 44 ? text.slice(0, 44).trimEnd() + '…' : text;
                setChats((prev) => [{ id, title, group: 'Today', messages: [userMsg] }, ...prev]);
                setActiveId(id);
            } else {
                setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: [...c.messages, userMsg] } : c)));
            }
            setDraft('');
            setPendingId(id);
            setTimeout(() => {
                setChats((prev) => prev.map((c) => (c.id === id ? { ...c, messages: [...c.messages, { role: 'assistant', text: NOT_CONNECTED }] } : c)));
                setPendingId(null);
            }, 1100);
        };

        const onKeyDown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        };

        return (
            <div className="h-full flex bg-[#26282B] text-[#f4f4f5] font-sans overflow-hidden relative">
                {showPricing && <PricingModal onClose={() => setShowPricing(false)} />}

                {/* Mobile backdrop */}
                {sidebarOpen && (
                    <div
                        className="fixed inset-0 bg-black/60 z-40 md:hidden"
                        onClick={() => setSidebarOpen(false)}
                    ></div>
                )}

                {/* Sidebar */}
                <aside
                    className={`fixed md:static inset-y-0 left-0 z-50 w-72 max-w-[85vw] shrink-0 flex flex-col bg-[#2C2E31] border-r border-[#3A3D42] transform transition-transform duration-200 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}
                    style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}
                >
                    <div className="px-4 py-4 flex items-center justify-between">
                        <a href="../" className="flex items-center gap-2.5">
                            <LogoMark />
                            <span className="font-bold tracking-tight text-base text-[#f4f4f5]">PluginForge</span>
                        </a>
                        <button
                            onClick={() => setSidebarOpen(false)}
                            className="md:hidden text-[#a1a1aa] hover:text-[#f4f4f5] p-1.5 rounded-md border border-[#3A3D42] bg-[#26282B] transition-colors"
                            aria-label="Close sidebar"
                        >
                            <Icon d={ICONS.close} className="w-4 h-4" />
                        </button>
                    </div>

                    <div className="px-3 space-y-2.5">
                        <button
                            onClick={newChat}
                            className="w-full bg-[#f4f4f5] hover:bg-[#e4e4e7] text-[#26282B] text-xs font-semibold py-2 rounded transition-colors flex items-center justify-center gap-1.5"
                        >
                            <Icon d={ICONS.plus} className="w-3.5 h-3.5" sw={2.5} />
                            New plugin
                        </button>
                        <div className="flex items-center gap-2 bg-[#26282B] border border-[#3A3D42] focus-within:border-[#71717a] rounded-md px-2.5 py-1.5 transition-colors">
                            <Icon d={ICONS.search} className="w-3.5 h-3.5 text-[#71717a] shrink-0" />
                            <input
                                id="chat-search"
                                type="text"
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                placeholder="Search chats"
                                className="w-full min-w-0 bg-transparent text-xs text-[#f4f4f5] placeholder-[#71717a] focus:outline-none"
                            />
                        </div>
                    </div>

                    <nav className="flex-1 min-h-0 overflow-y-auto px-3 pt-5 pb-3 space-y-5" aria-label="Chats">
                        {groups.length === 0 && (
                            <p className="px-2 text-xs text-[#71717a]">No chats match your search.</p>
                        )}
                        {groups.map((g) => (
                            <div key={g.name}>
                                <div className="px-2 mb-1.5 text-[11px] font-mono uppercase tracking-wider text-[#71717a]">{g.name}</div>
                                <ul className="space-y-0.5">
                                    {g.items.map((c) => (
                                        <li key={c.id} className="group relative">
                                            <button
                                                onClick={() => selectChat(c.id)}
                                                className={`w-full text-left text-[13px] pl-2.5 pr-8 py-2 rounded-md truncate transition-colors ${c.id === activeId ? 'bg-[#3A3D42] text-[#f4f4f5]' : 'text-[#a1a1aa] hover:bg-[#3A3D42]/50 hover:text-[#f4f4f5]'}`}
                                            >
                                                {c.title}
                                            </button>
                                            <button
                                                onClick={() => deleteChat(c.id)}
                                                className={`absolute right-1.5 top-1/2 -translate-y-1/2 p-1 rounded text-[#a1a1aa] hover:text-[#f4f4f5] hover:bg-[#26282B] transition-opacity focus:opacity-100 ${c.id === activeId ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}
                                                aria-label={`Delete ${c.title}`}
                                            >
                                                <Icon d={ICONS.trash} className="w-3.5 h-3.5" sw={1.75} />
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        ))}
                    </nav>

                    {/* User card */}
                    <div className="border-t border-[#3A3D42] p-3 space-y-3">
                        <div>
                            <div className="flex items-center justify-between text-[11px] font-mono text-[#71717a] mb-1.5">
                                <span>Generations today</span>
                                <span className="text-[#a1a1aa]">5 / 5 left</span>
                            </div>
                            <div className="h-1 rounded-full bg-[#3A3D42] overflow-hidden">
                                <div className="h-full w-full bg-[#f4f4f5] rounded-full"></div>
                            </div>
                        </div>
                        <div className="flex items-center gap-3 p-1.5 -m-1.5 rounded-lg">
                            <div className="w-9 h-9 rounded-md bg-[#3A3D42] border border-[#4b4f56] flex items-center justify-center text-sm font-semibold text-[#f4f4f5] shrink-0" aria-hidden="true">S</div>
                            <div className="min-w-0 flex-1">
                                <div className="text-sm font-medium text-[#f4f4f5] truncate">Steve</div>
                                <div className="text-[11px] font-mono text-[#71717a]">Stone Tier</div>
                            </div>
                            <button onClick={() => setShowPricing(true)} className="bg-[#26282B] hover:bg-[#3A3D42] border border-[#3A3D42] text-[#f4f4f5] text-[11px] font-medium px-2.5 py-1 rounded transition-colors">
                                Upgrade
                            </button>
                        </div>
                    </div>
                </aside>

                {/* Main chat area */}
                <main className="flex-1 min-w-0 flex flex-col relative">
                    <div className="absolute inset-0 bg-grid-pattern opacity-30 pointer-events-none z-0"></div>

                    <header
                        className="relative z-10 h-14 px-4 sm:px-6 border-b border-[#3A3D42] bg-[#26282B]/90 backdrop-blur-md flex items-center gap-3 shrink-0"
                    >
                        <button
                            onClick={() => setSidebarOpen(true)}
                            className="md:hidden text-[#a1a1aa] hover:text-[#f4f4f5] p-1.5 rounded-md border border-[#3A3D42] bg-[#2C2E31] transition-colors"
                            aria-label="Open sidebar"
                        >
                            <Icon d={ICONS.menu} className="w-4 h-4" />
                        </button>
                        <h1 className="text-sm font-medium text-[#f4f4f5] truncate min-w-0">
                            {active ? active.title : 'New plugin'}
                        </h1>
                        <span className="text-[10px] font-mono text-[#26282B] bg-[#f4f4f5] px-2.5 py-0.5 rounded-full font-semibold shrink-0">Preview</span>
                        <div className="ml-auto flex items-center gap-2 shrink-0">
                            <span className="hidden sm:inline-block text-[11px] font-mono text-[#a1a1aa] bg-[#2C2E31] border border-[#3A3D42] px-2.5 py-1 rounded-md">Paper 1.21.x</span>
                            <a href="../" className="text-[#a1a1aa] hover:text-[#f4f4f5] text-xs flex items-center gap-1.5 px-2 py-1 transition-colors">
                                <Icon d={ICONS.back} className="w-3.5 h-3.5" />
                                <span className="hidden sm:inline">Back to site</span>
                            </a>
                        </div>
                    </header>

                    <div className="relative z-10 flex-1 min-h-0 overflow-y-auto">
                        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8 min-h-full flex flex-col">
                            {!active && (
                                <div className="flex-1 flex flex-col items-center justify-center text-center py-10">
                                    <LogoMark className="w-10 h-10" />
                                    <h2 className="mt-6 text-2xl sm:text-3xl font-bold tracking-tight text-[#f4f4f5]">What do you want to build?</h2>
                                    <p className="mt-3 max-w-md text-xs sm:text-sm text-[#a1a1aa] leading-relaxed">
                                        Describe the plugin in plain English. PluginForge will turn it into a Paper plugin you can drop into your server.
                                    </p>
                                    <div className="mt-8 w-full grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
                                        {SUGGESTIONS.map((s) => (
                                            <button
                                                key={s.title}
                                                onClick={() => {
                                                    setDraft(s.text);
                                                    if (taRef.current) taRef.current.focus();
                                                }}
                                                className="bg-[#2C2E31] hover:bg-[#3A3D42]/60 border border-[#3A3D42] rounded-lg p-4 transition-colors"
                                            >
                                                <div className="text-sm font-medium text-[#f4f4f5] mb-1">{s.title}</div>
                                                <div className="text-xs text-[#a1a1aa] leading-relaxed">{s.text}</div>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {active && (
                                <div className="space-y-8">
                                    {messages.map((m, i) =>
                                        m.role === 'user'
                                            ? <UserMessage key={i} m={m} />
                                            : <AssistantMessage key={i} m={m} />
                                    )}
                                    {isPending && <TypingIndicator />}
                                </div>
                            )}
                            <div ref={endRef}></div>
                        </div>
                    </div>

                    {/* Composer */}
                    <div
                        className="relative z-10 px-4 sm:px-6 pt-2 pb-4 shrink-0"
                    >
                        <div className="max-w-3xl mx-auto">
                            <div className="bg-[#2C2E31] border border-[#3A3D42] rounded-2xl p-3 shadow-xl">
                                <div className="bg-[#26282B] border border-[#3A3D42] focus-within:border-[#71717a] rounded-xl p-2 transition-all">
                                    <textarea
                                        id="chat-input"
                                        ref={taRef}
                                        rows={1}
                                        maxLength={500}
                                        value={draft}
                                        onChange={(e) => setDraft(e.target.value)}
                                        onKeyDown={onKeyDown}
                                        placeholder={active ? 'Ask for a change, or describe another plugin...' : 'Describe the plugin you want to generate...'}
                                        className="w-full resize-none bg-transparent text-sm text-[#f4f4f5] placeholder-[#71717a] focus:outline-none px-2 py-1.5 leading-relaxed"
                                    ></textarea>
                                    <div className="flex items-center justify-between gap-3 px-2 pt-1">
                                        <span className="text-[11px] font-mono text-[#71717a]">{draft.length}/500</span>
                                        <button
                                            onClick={send}
                                            disabled={!draft.trim() || pendingId !== null}
                                            className="bg-[#f4f4f5] hover:bg-[#e4e4e7] disabled:bg-[#3A3D42] disabled:text-[#71717a] disabled:cursor-not-allowed text-[#26282B] p-2.5 rounded-lg transition-colors flex items-center justify-center shrink-0"
                                            aria-label="Send"
                                        >
                                            <Icon d={ICONS.send} className="w-4 h-4" sw={2.5} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <p className="mt-2.5 text-center text-[11px] text-[#71717a]">
                                Test generated plugins on a staging server before running them with real players.
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    }


    function App() {
        const [chats, setChats] = React.useState(SEED_CHATS);
        const [activeId, setActiveId] = React.useState('c1');
        return <ChatApp chats={chats} setChats={setChats} activeId={activeId} setActiveId={setActiveId} />;
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
